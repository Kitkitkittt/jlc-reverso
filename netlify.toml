[build]
  command = "npm run build"
  publish = "dist"

# Keep the site's Netlify toolbar and promotional badge disabled in hosting
# settings: their injected HUD script previously broke viewport resize.
# Application errors remain visible; no client-side error suppression is used.

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"
