<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Functional movement explanation, not spatial layout">
<title>Functional movement explanation, not spatial layout</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334b60"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f8fb"/>
<text x="55" y="60" font-family="Arial, sans-serif" font-size="30" fill="#192d41" font-weight="bold" text-anchor="start">Movement functions: general mechanism and outputs</text><text x="55" y="97" font-family="Arial, sans-serif" font-size="18" fill="#192d41" font-weight="normal" text-anchor="start">Functional explanation only. Box positions do not locate gears or bridges in Calibre 854/1.</text><rect x="60" y="160" width="250" height="95" rx="10" fill="#e8eef5" stroke="#435a70" stroke-width="2"/><text x="80" y="198" font-family="Arial, sans-serif" font-size="20" fill="#192d41" font-weight="bold" text-anchor="start">Manual crown input</text><text x="80" y="233" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">Winding subsystem</text><rect x="405" y="160" width="310" height="95" rx="10" fill="#e8eef5" stroke="#435a70" stroke-width="2"/><text x="425" y="198" font-family="Arial, sans-serif" font-size="20" fill="#192d41" font-weight="bold" text-anchor="start">Stored energy</text><text x="425" y="233" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">Barrel concept</text><rect x="800" y="160" width="330" height="95" rx="10" fill="#e8eef5" stroke="#435a70" stroke-width="2"/><text x="820" y="198" font-family="Arial, sans-serif" font-size="20" fill="#192d41" font-weight="bold" text-anchor="start">Timekeeping</text><text x="820" y="233" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">Train / escapement / balance</text><rect x="310" y="390" width="300" height="115" rx="10" fill="#e8eef5" stroke="#435a70" stroke-width="2"/><text x="330" y="428" font-family="Arial, sans-serif" font-size="20" fill="#192d41" font-weight="bold" text-anchor="start">RECTO OUTPUTS</text><text x="330" y="463" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">Hour / minute / small seconds</text><rect x="775" y="390" width="355" height="115" rx="10" fill="#e8eef5" stroke="#435a70" stroke-width="2"/><text x="795" y="428" font-family="Arial, sans-serif" font-size="20" fill="#192d41" font-weight="bold" text-anchor="start">REVERSE OUTPUTS</text><text x="795" y="463" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">Hour / minute / 24-hour</text><rect x="70" y="570" width="300" height="100" rx="10" fill="#e8eef5" stroke="#435a70" stroke-width="2"/><text x="90" y="608" font-family="Arial, sans-serif" font-size="20" fill="#192d41" font-weight="bold" text-anchor="start">GMT pusher</text><text x="90" y="643" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">+1-hour correction function</text><line x1="310" y1="207" x2="400" y2="207" stroke="#334b60" stroke-width="2" marker-end="url(#arrow)"/><line x1="715" y1="207" x2="795" y2="207" stroke="#334b60" stroke-width="2" marker-end="url(#arrow)"/><line x1="938" y1="255" x2="938" y2="360" stroke="#334b60" stroke-width="2"/><line x1="938" y1="360" x2="465" y2="360" stroke="#334b60" stroke-width="2"/><line x1="465" y1="360" x2="465" y2="385" stroke="#334b60" stroke-width="2" marker-end="url(#arrow)"/><line x1="938" y1="360" x2="938" y2="385" stroke="#334b60" stroke-width="2" marker-end="url(#arrow)"/><line x1="370" y1="620" x2="942" y2="620" stroke="#334b60" stroke-width="2"/><line x1="942" y1="620" x2="942" y2="510" stroke="#334b60" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="573" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">Exact reverse transfer/correction architecture is unresolved.</text><text x="55" y="725" font-family="Arial, sans-serif" font-size="18" fill="#192d41" font-weight="normal" text-anchor="start">Documented outputs share one manual movement. Exact part identities and coordinates need direct evidence.</text><text x="55" y="770" font-family="Arial, sans-serif" font-size="18" fill="#192d41" font-weight="bold" text-anchor="start">No rotor. No claimed gear tooth counts. No factory assembly order.</text>
</svg>
