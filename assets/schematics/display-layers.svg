<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Conceptual display and calibre grouping, not factory disassembly">
<title>Conceptual display and calibre grouping, not factory disassembly</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334b60"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f8fb"/>
<text x="55" y="60" font-family="Arial, sans-serif" font-size="31" fill="#192d41" font-weight="bold" text-anchor="start">Exploded-view grouping: two displays, one movement</text><text x="55" y="97" font-family="Arial, sans-serif" font-size="18" fill="#192d41" font-weight="normal" text-anchor="start">Conceptual layers only. This is not a service sequence or a measured section.</text><rect x="180" y="143" width="615" height="53" rx="7" fill="#dbe8ef" stroke="#435a70" stroke-width="2"/><text x="205" y="177" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">Recto crystal</text><text x="825" y="177" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">C105</text><rect x="180" y="216" width="615" height="53" rx="7" fill="#e5edf4" stroke="#435a70" stroke-width="2"/><text x="205" y="250" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">Recto hands</text><text x="825" y="250" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">D002 / D003 / D004</text><rect x="180" y="289" width="615" height="53" rx="7" fill="#eeeade" stroke="#435a70" stroke-width="2"/><text x="205" y="323" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">Recto dial</text><text x="825" y="323" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">D001</text><rect x="180" y="362" width="615" height="53" rx="7" fill="#d3dce5" stroke="#435a70" stroke-width="2"/><text x="205" y="396" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">One Calibre 854/1 module</text><text x="825" y="396" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">M000</text><rect x="180" y="435" width="615" height="53" rx="7" fill="#3d4b59" stroke="#435a70" stroke-width="2"/><text x="205" y="469" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Reverse dial</text><text x="825" y="469" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">D101</text><rect x="180" y="508" width="615" height="53" rx="7" fill="#e5edf4" stroke="#435a70" stroke-width="2"/><text x="205" y="542" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">Reverse hands</text><text x="825" y="542" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">D102 / D103 / D104</text><rect x="180" y="581" width="615" height="53" rx="7" fill="#dbe8ef" stroke="#435a70" stroke-width="2"/><text x="205" y="615" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">Reverse crystal</text><text x="825" y="615" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">C106</text><line x1="130" y1="304" x2="130" y2="156" stroke="#334b60" stroke-width="2" marker-end="url(#arrow)"/><text x="67" y="241" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">+Z</text><line x1="130" y1="496" x2="130" y2="633" stroke="#334b60" stroke-width="2" marker-end="url(#arrow)"/><text x="67" y="578" font-family="Arial, sans-serif" font-size="22" fill="#192d41" font-weight="bold" text-anchor="start">-Z</text><rect x="180" y="690" width="615" height="51" rx="7" fill="#b7c2cc" stroke="#435a70" stroke-width="2"/><text x="205" y="723" font-family="Arial, sans-serif" font-size="21" fill="#192d41" font-weight="bold" text-anchor="start">Moving case separates from fixed cradle</text><text x="55" y="786" font-family="Arial, sans-serif" font-size="17" fill="#192d41" font-weight="normal" text-anchor="start">All spacing is enlarged for presentation. Fasteners, retention and gasket geometry remain unresolved.</text>
</svg>
